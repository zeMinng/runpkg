[package]
name = "runpkg"
version = "0.0.1"
edition = "2024"
description = "runpkg — Interactive package.json manager for your terminal."
authors = ["zeMinng"]

[dependencies]
# CLI 参数解析
clap = { version = "4.4", features = ["derive"] }
# TUI 与终端控制
ratatui = "0.26"
crossterm = "0.27"
# 数据序列化与文件解析
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 错误处理
anyhow = "1.0"

tokio = { version = "1.36", features = ["full"] }
indexmap = { version = "2.0", features = ["serde"] }