name: Release runpkg

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: runpkg-windows-x64
            ext: .exe

          # Mac Intel
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: runpkg-macos-x64
            ext: ""

          # Mac Apple Silicon
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: runpkg-macos-arm64
            ext: ""

          # Linux
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: runpkg-linux-x64
            ext: ""

          # Linux ARM64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: runpkg-linux-arm64
            ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compiler (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/runpkg${{ matrix.ext }} dist/
          cd dist

          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            7z a ../${{ matrix.artifact }}.zip runpkg${{ matrix.ext }}
          else
            tar -czf ../${{ matrix.artifact }}.tar.gz runpkg
          fi

      # 暂存编译好的文件给后面的 release 任务用
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            *.zip
            *.tar.gz

  # 任务 2：统一创建 Release 并从 Commit 历史生成 Release Notes
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 必须拉取全部 Git 历史，以便提取上一个 Tag 至今的 Commit 记录
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum * > checksums.txt

      # 自动提取 Commit 提交历史生成 Changelog
      - name: Build Changelog from Commits
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          # 告诉 Action 使用 Commit 消息（即使没有 PR 也生效）
          commitMode: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 发布 Release 并写入上方生成的 Changelog
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          # 将上一步生成的日志当作 Release Body
          body: ${{ steps.build_changelog.outputs.changelog }}